[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "minutory-windows-worker"
version = "0.1.0"
description = "Headless core for the native Minutory Windows ingestion worker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "python-dotenv>=1.0,<2",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
]

[project.scripts]
minutory-worker = "minutory_worker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/minutory_worker"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["minutory_worker"]
